 <!DOCTYPE html>
<html>
<head>
  <title>SpacePulse - Schedule</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .done { color: #5fd38d; }
    .overdue { color: #ff6b6b; }
    .upcoming { opacity: 0.8; }
  </style>
</head>
<body>
  <header>
    <div>
      <a href="dashboard.html">← Back to dashboard</a>
      <h1>Today's Schedule</h1>
    </div>
    <button id="logout">Log out</button>
  </header>

  <p id="summary"></p>
  <div id="content"></div>

  <script src="shared.js"></script>
  <script>
    requireLogin();
    document.getElementById("logout").addEventListener("click", logout);

    const TASKS = [
      { time: "07:00", name: "Wake-up and hygiene" },
      { time: "07:30", name: "Breakfast and health check-in" },
      { time: "08:30", name: "Exercise (treadmill and resistance)" },
      { time: "10:00", name: "Science experiment" },
      { time: "12:30", name: "Lunch" },
      { time: "14:00", name: "Equipment maintenance" },
      { time: "16:00", name: "Medical self-check and log" },
      { time: "18:00", name: "Dinner" },
      { time: "19:30", name: "Crew communication and free time" },
      { time: "22:00", name: "Sleep" },
    ];

    let done = [];

    async function toggle(i) {
      const r = await api("/api/schedule/" + i, { method: "POST" });
      if (r.done) done.push(i); else done = done.filter((x) => x !== i);
      render();
    }

    function render() {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      let due = 0, doneDue = 0;

      const rows = TASKS.map((t, i) => {
        const [h, m] = t.time.split(":").map(Number);
        const isDone = done.includes(i);
        const isPast = h * 60 + m <= nowMin;
        if (isPast) { due++; if (isDone) doneDue++; }
        const status = isDone ? "Done" : isPast ? "Overdue" : "Upcoming";
        const cls = isDone ? "done" : isPast ? "overdue" : "upcoming";
        return '<tr class="' + cls + '"><td>' + t.time + "</td><td>" + t.name + "</td><td>" + status +
               '</td><td><button class="secondary" onclick="toggle(' + i + ')">' +
               (isDone ? "Undo" : "Mark done") + "</button></td></tr>";
      }).join("");

      const pct = due === 0 ? 100 : Math.round((doneDue / due) * 100);
      document.getElementById("summary").textContent =
        "Schedule adherence so far: " + pct + "% (" + doneDue + " of " + due + " due tasks done)";
      document.getElementById("content").innerHTML =
        "<table><tr><th>Time</th><th>Task</th><th>Status</th><th></th></tr>" + rows + "</table>";
    }

    api("/api/schedule").then((d) => { done = d; render(); });
    setInterval(render, 30000);
  </script>
</body>
</html>
